name: Github-Rdp

on:
  workflow_dispatch:

jobs:
  build-on-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      # Step 1: Create Rohit user and set password
      - name: Create Rohit user
        shell: cmd
        continue-on-error: true
        run: |
          net user Rohit "OLDUNER#6" /add
          net localgroup Administrators Rohit /add
          net user Rohit /active:yes

      # Configure Git identity system-wide
      - name: Configure Git identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $userName = "${{ secrets.CODEBERG_USERNAME }}"
          $userEmail = "${{ secrets.CODEBERG_EMAIL }}"
          if (-not [string]::IsNullOrWhiteSpace($userName)) { git config --system user.name "$userName" }
          if (-not [string]::IsNullOrWhiteSpace($userEmail)) { git config --system user.email "$userEmail" }
          git config --system --list | Select-String "user\."
          Write-Output "Git identity configured"

      # Install VS Code (system-wide so all users can use it)
      - name: Install VS Code
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://update.code.visualstudio.com/latest/win32-x64/stable"
          $output = "$env:TEMP\VSCodeSetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          Start-Process -FilePath $output -Args "/silent /mergetasks=!runcode" -Wait

      # Install opencode-ai (synchronous, available for all users)
      - name: Install opencode-ai
        shell: pwsh
        continue-on-error: true
        run: |
          $rohitDir = "C:\Users\Rohit\AppData\Roaming\npm"
          New-Item -ItemType Directory -Force -Path $rohitDir
          npm config set prefix $rohitDir
          npm install -g opencode-ai
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -notlike "*$rohitDir*") {
            [Environment]::SetEnvironmentVariable("Path", "$machinePath;$rohitDir", "Machine")
          }

      # Install Bun (synchronous, available for all users)
      - name: Install Bun
        shell: pwsh
        continue-on-error: true
        run: |
          $env:BUN_INSTALL = "C:\Users\Rohit\.bun"
          irm bun.sh/install.ps1 | iex
          $bunDir = "C:\Users\Rohit\.bun\bin"
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -notlike "*$bunDir*") {
            [Environment]::SetEnvironmentVariable("Path", "$machinePath;$bunDir", "Machine")
          }

      # Step 2: Install OpenPort CLI + verify rathole engine exists
      - name: Install OpenPort
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          iwr -useb https://openport.pw/install.ps1 | iex

          $bin = "$env:USERPROFILE\.openport\bin"
          $rathole = Join-Path $bin "rathole.exe"

          if (-not (Test-Path $rathole)) {
            Write-Host "rathole.exe missing — downloading directly from upstream..."
            $url = "https://github.com/rapiz1/rathole/releases/latest/download/rathole-x86_64-pc-windows-msvc.zip"
            $zip = "$env:TEMP\rathole.zip"
            iwr -useb $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $bin -Force
          }

          if (-not (Test-Path $rathole)) { throw "rathole.exe still missing after fallback" }
          Get-ChildItem $bin | Format-Table Name, Length
          Write-Host "OpenPort install verified: rathole.exe present"

      # Step 3: Link existing permanent port to this runner
      - name: OpenPort link
        shell: powershell
        run: |
          $openportCmd = "$env:USERPROFILE\.openport\bin\openport.cmd"
          if (-not (Test-Path $openportCmd)) { throw "openport.cmd not found at $openportCmd" }
          & $openportCmd link usr_f3b785d7 ba25f021d9586a7607686750cbc79ad2

      # Step 4: Run reverse tunnel with OpenPort (openport <local_port>)
      - name: Run reverse tunnel with OpenPort
        shell: powershell
        timeout-minutes: 350
        continue-on-error: true
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          $openportCmd = "$env:USERPROFILE\.openport\bin\openport.cmd"
          while ($true) {
              # openport 3389  -> forwards local RDP port 3389 to public permanent port (TCP + UDP)
              & $openportCmd 3389
              Start-Sleep -Seconds 10
          }
