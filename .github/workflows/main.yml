name: Github-Rdp[Windows]

on:
  workflow_dispatch:

jobs:
  build-on-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      # Step 1: Create Rohit user and set password
      - name: Create Rohit user
        shell: cmd
        continue-on-error: true
        run: |
          net user Rohit "OLDUNER#6" /add
          net localgroup Administrators Rohit /add
          net user Rohit /active:yes

      # Create a single machine-wide root. Keep ALL tooling here so we never
      # create the C:\Users\Rohit stub that used to hijack profile resolution.
      - name: Prepare ghvm root and secrets file
        shell: pwsh
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ProgramData\ghvm'
          foreach ($d in @($root, (Join-Path $root 'bin'), (Join-Path $root 'state'), (Join-Path $root 'npm'), (Join-Path $root 'bun'))) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }

          function ConvertTo-EnvLiteral([string]$Value) {
            if ($null -eq $Value) { $Value = '' }
            return "'" + $Value.Replace("'", "''") + "'"
          }
          $lines = @(
            ('$S3Endpoint = ' + (ConvertTo-EnvLiteral $env:S3_ENDPOINT))
            ('$S3Bucket = ' + (ConvertTo-EnvLiteral $env:S3_BUCKET))
            ('$S3Region = ' + (ConvertTo-EnvLiteral $env:S3_REGION))
            ('$S3AccessKeyId = ' + (ConvertTo-EnvLiteral $env:S3_ACCESS_KEY_ID))
            ('$S3SecretAccessKey = ' + (ConvertTo-EnvLiteral $env:S3_SECRET_ACCESS_KEY))
          )
          Set-Content -Path (Join-Path $root 'ghvm.env.ps1') -Value $lines -Encoding utf8

          $binDir = Join-Path $root 'bin'
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike "*$binDir*") {
            [Environment]::SetEnvironmentVariable('Path', ($machinePath.TrimEnd(';') + ';' + $binDir), 'Machine')
          }

          icacls $root /inheritance:r /grant:r "SYSTEM:(OI)(CI)F" "Administrators:(OI)(CI)F" | Out-Null
          # Tool dirs must be readable/executable by regular (non-elevated) users,
          # while secrets, state and logs stay restricted to SYSTEM/Administrators.
          foreach ($shared in @('bin', 'npm', 'bun')) {
            icacls (Join-Path $root $shared) /inheritance:r `
              /grant:r "SYSTEM:(OI)(CI)F" "Administrators:(OI)(CI)F" "Users:(OI)(CI)RX" | Out-Null
          }
          icacls (Join-Path $root 'ghvm.env.ps1') /inheritance:r /grant:r "SYSTEM:F" "Administrators:F" | Out-Null
          Write-Output "Prepared $root"

      # Install VS Code (system-wide so all users can use it)
      - name: Install VS Code
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://update.code.visualstudio.com/latest/win32-x64/stable"
          $output = "$env:TEMP\VSCodeSetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          Start-Process -FilePath $output -Args "/silent /mergetasks=!runcode" -Wait

      # Save Codeberg private SSH key system-wide so any user can use it
      - name: Save Codeberg SSH key (system-wide)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sshDir = "C:\ProgramData\ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir "id_ed25519"
          $key = "${{ secrets.CODEBERG_PRIVATE_SSHKEY }}"
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Output "CODEBERG_PRIVATE_SSHKEY not set, skipping"
            exit 0
          }
          [IO.File]::WriteAllText($keyPath, $key.Replace("`r`n", "`n").TrimEnd("`n") + "`n")

          $configPath = Join-Path $sshDir "ssh_config"
          $configLines = @(
              "Host codeberg.org"
              "    HostName codeberg.org"
              "    User git"
              "    IdentityFile $keyPath"
              "    IdentitiesOnly yes"
          )
          Set-Content -Path $configPath -Value $configLines -Encoding ascii

          icacls $sshDir /inheritance:r /grant:r "SYSTEM:(OI)(CI)F" "Administrators:(OI)(CI)F" "Users:(OI)(CI)RX" | Out-Null
          icacls $keyPath /inheritance:r /grant:r "SYSTEM:F" "Administrators:F" | Out-Null
          Write-Output "Saved SSH key to $keyPath"

      # Configure Git identity system-wide
      - name: Configure Git identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $userName = "${{ secrets.CODEBERG_USERNAME }}"
          $userEmail = "${{ secrets.CODEBERG_EMAIL }}"
          if (-not [string]::IsNullOrWhiteSpace($userName)) { git config --system user.name "$userName" }
          if (-not [string]::IsNullOrWhiteSpace($userEmail)) { git config --system user.email "$userEmail" }
          git config --system --list | Select-String "user\."
          Write-Output "Git identity configured"

      # Install s5cmd (fast parallel S3 client) into the ghvm bin dir
      - name: Install s5cmd
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'C:\ProgramData\ghvm\bin'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "s5cmd.zip"
          $url = "https://github.com/peak/s5cmd/releases/download/v2.3.0/s5cmd_2.3.0_Windows-64bit.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          & "$dir\s5cmd.exe" version
          Write-Output "Installed s5cmd to $dir"

      # Register a scheduled task that mirrors the user's Desktop\Data to S3.
      # The task resolves the *real* profile via ProfileList/NTUSER.DAT instead
      # of guessing from a directory name, which is what broke the old version.
      - name: Register S3 watcher scheduled task
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ProgramData\ghvm'
          $scriptPath = Join-Path $root 'sync-data.ps1'

          $script = @'
          $ErrorActionPreference = 'Continue'

          $Root = 'C:\ProgramData\ghvm'
          $Log = Join-Path $Root 'sync.log'
          $S5 = Join-Path $Root 'bin\s5cmd.exe'
          $StateDir = Join-Path $Root 'state'
          $WatchUser = 'Rohit'

          . (Join-Path $Root 'ghvm.env.ps1')

          $env:AWS_ACCESS_KEY_ID = $S3AccessKeyId
          $env:AWS_SECRET_ACCESS_KEY = $S3SecretAccessKey
          $env:AWS_REGION = $S3Region
          $env:AWS_DEFAULT_REGION = $S3Region

          New-Item -ItemType Directory -Force -Path $StateDir | Out-Null

          function Write-Log([string]$Message) {
              Add-Content -Path $Log -Value ('{0} {1}' -f (Get-Date -Format o), $Message) -ErrorAction SilentlyContinue
          }

          # Resolve the real profile for the watched user. A profile is only
          # considered valid when NTUSER.DAT exists, so empty stub dirs are never picked.
          function Get-WatchProfile {
              $user = Get-LocalUser -Name $WatchUser -ErrorAction SilentlyContinue
              if (-not $user) { return $null }
              $sid = $user.SID.Value
              $reg = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\' + $sid
              $path = (Get-ItemProperty -Path $reg -Name ProfileImagePath -ErrorAction SilentlyContinue).ProfileImagePath
              if ($path) {
                  $path = [Environment]::ExpandEnvironmentVariables($path)
                  if (Test-Path -LiteralPath (Join-Path $path 'NTUSER.DAT')) { return $path }
              }
              $cim = Get-CimInstance Win32_UserProfile -ErrorAction SilentlyContinue |
                  Where-Object { $_.SID -eq $sid } | Select-Object -First 1
              if ($cim -and $cim.LocalPath -and (Test-Path -LiteralPath (Join-Path $cim.LocalPath 'NTUSER.DAT'))) {
                  return $cim.LocalPath
              }
              return $null
          }

          function Restore-Data([string]$Target) {
              New-Item -ItemType Directory -Force -Path $Target | Out-Null
              Write-Log 'restore: syncing from S3'
              & $S5 --endpoint-url $S3Endpoint --numworkers 64 sync --exclude "*/node_modules/*" "s3://$S3Bucket/Data/" $Target *>> $Log
              if ($LASTEXITCODE -ne 0) { Write-Log "restore: failed ($LASTEXITCODE)"; return $false }
              Write-Log 'restore: complete'
              return $true
          }

          # Never run --delete from an empty local folder. This makes a wiped or
          # temporarily unavailable profile filesystem unable to erase the backup.
          function Sync-Data([string]$Source) {
              if (-not $Source -or -not (Test-Path -LiteralPath $Source)) { return }
              $localCount = @(Get-ChildItem -LiteralPath $Source -Recurse -File -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }).Count
              if ($localCount -eq 0) {
                  Write-Log 'sync: skipped (local folder empty)'
                  return
              }
              & $S5 --endpoint-url $S3Endpoint --numworkers 64 sync --delete --exclude "*/node_modules/*" ($Source.TrimEnd('\') + '\') "s3://$S3Bucket/Data/" *>> $Log
              if ($LASTEXITCODE -ne 0) { Write-Log "sync: failed ($LASTEXITCODE)" }
          }

          $src = $null
          $marker = $null
          $watcher = $null
          $lastSync = Get-Date
          $lastEvent = Get-Date
          $pending = $false

          Write-Log 'watcher: started'

          while ($true) {
              if (-not $src) {
                  $profile = Get-WatchProfile
                  if (-not $profile) { Start-Sleep -Seconds 10; continue }
                  $sid = (Get-LocalUser -Name $WatchUser).SID.Value
                  $src = Join-Path $profile 'Desktop\Data'
                  $marker = Join-Path $StateDir ($sid + '.restored')
                  New-Item -ItemType Directory -Force -Path $src | Out-Null
                  Write-Log ("watcher: profile=" + $profile)
                  if (-not (Test-Path -LiteralPath $marker)) {
                      if (Restore-Data $src) {
                          New-Item -ItemType File -Force -Path $marker | Out-Null
                      } else {
                          Start-Sleep -Seconds 30
                          $src = $null
                          $marker = $null
                          continue
                      }
                  }
                  Sync-Data $src
                  $lastSync = Get-Date
                  try {
                      if ($watcher) { $watcher.Dispose() }
                      $watcher = New-Object IO.FileSystemWatcher $src, '*'
                      $watcher.IncludeSubdirectories = $true
                      $watcher.NotifyFilter = [IO.NotifyFilters]::FileName -bor [IO.NotifyFilters]::DirectoryName -bor [IO.NotifyFilters]::LastWrite -bor [IO.NotifyFilters]::Size
                      $watcher.EnableRaisingEvents = $true
                  } catch {
                      $watcher = $null
                      Write-Log ("watcher: error " + $_.Exception.Message)
                  }
              }

              $changed = $false
              if ($watcher) {
                  try {
                      $r = $watcher.WaitForChanged([IO.WatcherChangeTypes]::All, 1000)
                      if (-not $r.TimedOut) { $changed = $true }
                  } catch {
                      $watcher.Dispose()
                      $watcher = $null
                      $changed = $true
                  }
              } else {
                  Start-Sleep -Milliseconds 1000
              }

              if ($changed) { $pending = $true; $lastEvent = Get-Date }
              if ($pending -and ((Get-Date) - $lastEvent).TotalSeconds -ge 5) {
                  Sync-Data $src
                  $pending = $false
                  $lastSync = Get-Date
              }
              if (((Get-Date) - $lastSync).TotalMinutes -ge 5) {
                  Sync-Data $src
                  $lastSync = Get-Date
                  $pending = $false
              }
              if ($src -and -not (Test-Path -LiteralPath $src)) {
                  if ($watcher) { $watcher.Dispose(); $watcher = $null }
                  if ($marker) { Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue }
                  $src = $null
                  $marker = $null
              }
          }
          '@

          Set-Content -Path $scriptPath -Value $script -Encoding utf8
          icacls $scriptPath /inheritance:r /grant:r "SYSTEM:F" "Administrators:F" | Out-Null

          $pwsh = "$env:ProgramFiles\PowerShell\7\pwsh.exe"
          if (-not (Test-Path -LiteralPath $pwsh)) { $pwsh = "powershell.exe" }

          $action = New-ScheduledTaskAction -Execute $pwsh -Argument "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$scriptPath`""
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(10)
          $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries `
              -StartWhenAvailable -MultipleInstances IgnoreNew -ExecutionTimeLimit ([TimeSpan]::Zero) `
              -RestartCount 10 -RestartInterval (New-TimeSpan -Minutes 1)
          Register-ScheduledTask -TaskName "GhvmS3Sync" -Action $action -Trigger $trigger `
              -Principal $principal -Settings $settings -Force | Out-Null
          Start-ScheduledTask -TaskName "GhvmS3Sync"
          Start-Sleep -Seconds 5
          $info = Get-ScheduledTaskInfo -TaskName "GhvmS3Sync"
          Write-Output "GhvmS3Sync state=$((Get-ScheduledTask -TaskName 'GhvmS3Sync').State) lastResult=$($info.LastTaskResult)"

      # Step 3: Download Pinggy CLI
      - name: Download Pinggy CLI
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://s3.ap-south-1.amazonaws.com/public.pinggy.binaries/cli/v0.2.5/windows/amd64/pinggy.exe"
          $output = "$env:USERPROFILE\pinggy.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          Write-Output "Downloaded pinggy.exe to $output"

      # Install opencode-ai into a shared prefix (NOT the user profile)
      - name: Install opencode-ai
        shell: pwsh
        continue-on-error: true
        run: |
          $prefix = 'C:\ProgramData\ghvm\npm'
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          $env:NPM_CONFIG_PREFIX = $prefix
          npm config set prefix $prefix --global
          npm install -g opencode-ai
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike "*$prefix*") {
            [Environment]::SetEnvironmentVariable('Path', ($machinePath.TrimEnd(';') + ';' + $prefix), 'Machine')
          }

      # Install Bun into a shared prefix (NOT the user profile)
      - name: Install Bun
        shell: pwsh
        continue-on-error: true
        run: |
          $bunRoot = 'C:\ProgramData\ghvm\bun'
          $env:BUN_INSTALL = $bunRoot
          irm bun.sh/install.ps1 | iex
          $bunDir = Join-Path $bunRoot 'bin'
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike "*$bunDir*") {
            [Environment]::SetEnvironmentVariable('Path', ($machinePath.TrimEnd(';') + ';' + $bunDir), 'Machine')
          }

      # Step 4: Run reverse tunnel with Pinggy (timeout 5h 45m)
      - name: Run reverse tunnel with Pinggy
        shell: pwsh
        timeout-minutes: 350
        continue-on-error: true
        run: |
          # S3 mirroring runs independently in scheduled task GhvmS3Sync
          $pinggy = "$env:USERPROFILE\pinggy.exe"
          while ($true) {
              & $pinggy -p 443 -R0:127.0.0.1:3389 `
                  -o StrictHostKeyChecking=no `
                  -o ServerAliveInterval=30 `
                  0WQ85RZeimH+force+tcp@free.pinggy.io
              Start-Sleep -Seconds 10
          }

      # Stop the watcher and do a final, verified upload
      - name: Upload Data to S3
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true
        run: |
          $root = 'C:\ProgramData\ghvm'
          $log = Join-Path $root 'sync.log'
          function Write-Log([string]$Message) {
            Add-Content -Path $log -Value ('{0} {1}' -f (Get-Date -Format o), $Message) -ErrorAction SilentlyContinue
            Write-Output $Message
          }
          . (Join-Path $root 'ghvm.env.ps1')
          $env:AWS_ACCESS_KEY_ID = $S3AccessKeyId
          $env:AWS_SECRET_ACCESS_KEY = $S3SecretAccessKey
          $env:AWS_REGION = $S3Region
          $env:AWS_DEFAULT_REGION = $S3Region
          $s5 = Join-Path $root 'bin\s5cmd.exe'

          function Get-WatchProfile {
              $user = Get-LocalUser -Name 'Rohit' -ErrorAction SilentlyContinue
              if (-not $user) { return $null }
              $sid = $user.SID.Value
              $reg = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\' + $sid
              $path = (Get-ItemProperty -Path $reg -Name ProfileImagePath -ErrorAction SilentlyContinue).ProfileImagePath
              if ($path) {
                  $path = [Environment]::ExpandEnvironmentVariables($path)
                  if (Test-Path -LiteralPath (Join-Path $path 'NTUSER.DAT')) { return $path }
              }
              $cim = Get-CimInstance Win32_UserProfile -ErrorAction SilentlyContinue |
                  Where-Object { $_.SID -eq $sid } | Select-Object -First 1
              if ($cim -and $cim.LocalPath -and (Test-Path -LiteralPath (Join-Path $cim.LocalPath 'NTUSER.DAT'))) { return $cim.LocalPath }
              return $null
          }

          $profile = Get-WatchProfile
          if (-not $profile) { Write-Log 'final: no profile resolved, skipping upload'; exit 0 }
          $src = Join-Path $profile 'Desktop\Data'
          if (-not (Test-Path -LiteralPath $src)) { Write-Log "final: no Data folder at $src, skipping"; exit 0 }

          Stop-ScheduledTask -TaskName "GhvmS3Sync" -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName "GhvmS3Sync" -Confirm:$false -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 30; $i++) {
              if (-not (Get-Process s5cmd -ErrorAction SilentlyContinue)) { break }
              Start-Sleep -Seconds 2
          }

          $localCount = @(Get-ChildItem -LiteralPath $src -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }).Count
          if ($localCount -eq 0) {
              Write-Log 'final: local folder empty, skipping upload'
              exit 0
          }

          & $s5 --endpoint-url $S3Endpoint --numworkers 64 sync --delete --exclude "*/node_modules/*" ($src.TrimEnd('\') + '\') "s3://$S3Bucket/Data/"
          if ($LASTEXITCODE -ne 0) { Write-Log "final: upload failed ($LASTEXITCODE)"; exit 1 }
          Write-Log "final: uploaded $src to s3://$S3Bucket/Data/"
