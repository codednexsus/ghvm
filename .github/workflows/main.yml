name: Github-Rdp[Windows]

on:
  workflow_dispatch:

jobs:
  build-on-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      # Step 1: Create Rohit user and set password
      - name: Create Rohit user
        shell: cmd
        continue-on-error: true
        run: |
          net user Rohit "OLDUNER#6" /add
          net localgroup Administrators Rohit /add
          net user Rohit /active:yes

      # Configure Git identity system-wide
      - name: Configure Git identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $userName = "${{ secrets.CODEBERG_USERNAME }}"
          $userEmail = "${{ secrets.CODEBERG_EMAIL }}"
          if (-not [string]::IsNullOrWhiteSpace($userName)) { git config --system user.name "$userName" }
          if (-not [string]::IsNullOrWhiteSpace($userEmail)) { git config --system user.email "$userEmail" }
          git config --system --list | Select-String "user\."
          Write-Output "Git identity configured"

      # Save Codeberg private SSH key system-wide so any user can use it
      - name: Save Codeberg SSH key (system-wide)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sshDir = "C:\ProgramData\ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir "id_ed25519"
          $key = "${{ secrets.CODEBERG_PRIVATE_SSHKEY }}"
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Output "CODEBERG_PRIVATE_SSHKEY not set, skipping"
            exit 0
          }
          [IO.File]::WriteAllText($keyPath, $key.Replace("`r`n", "`n").TrimEnd("`n") + "`n")

          $configPath = Join-Path $sshDir "ssh_config"
          $configLines = @(
              "Host codeberg.org"
              "    HostName codeberg.org"
              "    User git"
              "    IdentityFile $keyPath"
              "    IdentitiesOnly yes"
          )
          Set-Content -Path $configPath -Value $configLines -Encoding ascii

          icacls $sshDir /inheritance:r /grant:r "SYSTEM:(OI)(CI)F" "Administrators:(OI)(CI)F" "Users:(OI)(CI)RX" | Out-Null
          icacls $keyPath /inheritance:r /grant:r "SYSTEM:F" "Administrators:F" | Out-Null
          Write-Output "Saved SSH key to $keyPath"

      # Install VS Code (system-wide so all users can use it)
      - name: Install VS Code
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://update.code.visualstudio.com/latest/win32-x64/stable"
          $output = "$env:TEMP\VSCodeSetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          Start-Process -FilePath $output -Args "/silent /mergetasks=!runcode" -Wait

      # Step 2: Download Pinggy CLI
      - name: Download Pinggy CLI
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://s3.ap-south-1.amazonaws.com/public.pinggy.binaries/cli/v0.2.5/windows/amd64/pinggy.exe"
          $output = "$env:USERPROFILE\pinggy.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          Write-Output "Downloaded pinggy.exe to $output"

      # Install opencode-ai (synchronous, available for all users)
      - name: Install opencode-ai
        shell: pwsh
        continue-on-error: true
        run: |
          $rohitDir = "C:\Users\Rohit\AppData\Roaming\npm"
          New-Item -ItemType Directory -Force -Path $rohitDir
          npm config set prefix $rohitDir
          npm install -g opencode-ai
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -notlike "*$rohitDir*") {
            [Environment]::SetEnvironmentVariable("Path", "$machinePath;$rohitDir", "Machine")
          }

      # Install Bun (synchronous, available for all users)
      - name: Install Bun
        shell: pwsh
        continue-on-error: true
        run: |
          $env:BUN_INSTALL = "C:\Users\Rohit\.bun"
          irm bun.sh/install.ps1 | iex
          $bunDir = "C:\Users\Rohit\.bun\bin"
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -notlike "*$bunDir*") {
            [Environment]::SetEnvironmentVariable("Path", "$machinePath;$bunDir", "Machine")
          }

      # Step 3: Run reverse tunnel with Pinggy (timeout 5h 45m)
      - name: Run reverse tunnel with Pinggy
        shell: pwsh
        timeout-minutes: 350
        continue-on-error: true
        run: |
          $pinggy = "$env:USERPROFILE\pinggy.exe"
          while ($true) {
              & $pinggy -p 443 -R0:127.0.0.1:3389 `
                  -o StrictHostKeyChecking=no `
                  -o ServerAliveInterval=30 `
                  0WQ85RZeimH+force+tcp@free.pinggy.io
              Start-Sleep -Seconds 10
          }
